[project]
name = "tutorial-video"
version = "0.1.0"
description = "Narration + assembly pipeline for a fluid-design coding tutorial video"
requires-python = ">=3.11"
dependencies = [
    "google-genai",
    "python-dotenv",
    "numpy",
    "mlx-whisper; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "faster-whisper; sys_platform != 'darwin' or platform_machine != 'arm64'",
]

[tool.uv]
package = false
