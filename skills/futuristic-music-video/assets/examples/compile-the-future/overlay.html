<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>overlay</title>
<!--
  Machine-layer overlay. A pure function of time: window.seek(t) draws song-time t.
  Contract: no timers, no Date.now/performance.now, no requestAnimationFrame, no CSS transitions,
  no unseeded Math.random. Transparent background; assembly composites it over plates.

  Data comes from window.__DATA__ = {beats, lyrics, storyboard} injected by render_overlay.mjs.
  For a live browser preview, serve the project root (npx serve .) and open
  /assets/overlay/overlay.html?preview=1 — it fetches the default paths below and plays the timeline.

  Customise per video: TOKENS (from the bible), the VOCAB section, lyric styling, and SCENES.
  4K: layout is authored in 1920x1080 CSS px; the canvas backing store is devicePixelRatio-scaled, so
  `render_overlay.mjs --scale 2` gives crisp 3840x2160 frames with no layout changes.
  Scenes: lyric-driven graphics that take over from the HUD for specific lines, then hand back to it.
  When = assets/overlay/scenes.json (anchored to lyric phrases), what = the SCENES functions below.
  A HUD that is on screen the whole song gets boring; aim for a scene on most lyric lines that have a concrete image.
-->
<style>
  @font-face { font-family: "Big Shoulders Display"; src: url("fonts/BigShouldersDisplay.ttf"); font-weight: 100 900; }
  @font-face { font-family: "Share Tech Mono"; src: url("fonts/ShareTechMono-Regular.ttf"); }
  /* Compile the Future: NOIR SIGNAL tokens (video/bible.md). Green is reserved for the BUILD's green check. */
  :root {
    --bg:     #07090C;
    --cool:   #3EF0FF;
    --accent2:#FF3EA5;
    --warn:   #FFB25A;
    --signal: #39FF6A;
    --type:   #EDEFF2;
    --dim:    #3A4650;
    --font-display: "Big Shoulders Display", "Arial Narrow", sans-serif;
    --font-mono: "Share Tech Mono", Menlo, monospace;
  }
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: transparent; }
  body.green { background: #00FF00; }
  canvas { display: block; width: 1920px; height: 1080px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<canvas id="gl" style="display:none"></canvas>
<!-- 3D layer (optional): three.js + world3d.js, served from disk by render_overlay.mjs (http://overlay.local).
     Copy $SKILL/assets/world3d.js next to this file. ?gl=off or a missing module -> 2D only. -->
<script type="importmap">{"imports": {"three": "/__three/three.module.js", "three/addons/": "/__three_addons/"}}</script>
<script type="module">
  import * as THREE from 'three';
  import { LineSegments2 } from 'three/addons/lines/LineSegments2.js';
  import { LineSegmentsGeometry } from 'three/addons/lines/LineSegmentsGeometry.js';
  import { LineMaterial } from 'three/addons/lines/LineMaterial.js';
  import { createWorld3D } from './world3d.js';
  window.__three = { THREE, LINES: { LineSegments2, LineSegmentsGeometry, LineMaterial }, createWorld3D };
  window.dispatchEvent(new Event('three-ready'));
</script>
<script>
(() => {
  const W = 1920, H = 1080;
  const cv = document.getElementById('c');
  const DPR = window.devicePixelRatio || 1;                  // 2 with render_overlay.mjs --scale 2
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  let g = cv.getContext('2d');                         // let: panel layers draw into offscreen canvases (see seek)
  const qs = new URLSearchParams(location.search);
  if (qs.get('bg') === 'green') document.body.classList.add('green');

  // ---------- tokens (keep names; values come from the bible) ----------
  const css = getComputedStyle(document.documentElement);
  const T = k => css.getPropertyValue(k).trim();
  const C = { bg: T('--bg'), cool: T('--cool'), mag: T('--accent2'), warn: T('--warn'), signal: T('--signal'),
              type: T('--type'), dim: T('--dim') };
  C.alarm = C.mag;                                            // "failure" colour in this palette = magenta
  const FONT_D = T('--font-display'), FONT_M = T('--font-mono');

  // ---------- deterministic helpers ----------
  const hash = (i, s = 0) => { let x = Math.sin(i * 127.1 + s * 311.7) * 43758.5453; return x - Math.floor(x); };
  const rand = (seed) => hash(seed, 7.3);                     // seeded 0..1
  const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
  const lerp = (a, b, k) => a + (b - a) * k;
  const ease = k => 1 - Math.pow(1 - clamp(k), 4);            // ~cubic-bezier(.16,1,.3,1)
  const easeIn = k => Math.pow(clamp(k), 3);                  // for faster exits
  const spring = (age, w = 18, z = 0.45) =>                   // closed-form damped spring 0→1
    age <= 0 ? 0 : 1 - Math.exp(-z * w * age) * Math.cos(w * Math.sqrt(1 - z * z) * age);
  const alpha = (hex, a) => {
    const n = parseInt(hex.replace('#', ''), 16);
    return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${clamp(a)})`;
  };
  // last event at or before t in a sorted array → {i, time, age}
  function last(t, arr) {
    let lo = 0, hi = arr.length - 1, i = -1;
    while (lo <= hi) { const m = (lo + hi) >> 1; if (arr[m] <= t) { i = m; lo = m + 1; } else hi = m - 1; }
    return i < 0 ? { i: -1, time: -1e9, age: 1e9 } : { i, time: arr[i], age: t - arr[i] };
  }

  // ---------- data ----------
  let B = { duration: 60, bpm: 120, fps: 30, beats: [], downbeats: [], onsets: [], strong_onsets: [], loudness: [], sections: [] };
  let LYR = [];      // [{t, text, end?}]
  let SB = null;     // storyboard {cuts:[...]}
  // Music events from scripts/drops.py, passed through storyboard.markers.drops: [{t, kind, strength, dir?}]
  // kind: drop | break | beat_change | build. The storyboard already cuts on them; the overlay hits them too.
  let EV = [];
  const eventNear = (t0, kind, win, minS = 0.3) =>
    EV.find(e => e.kind === kind && e.strength >= minS && Math.abs(e.t - t0) <= win) || null;
  const lastEvent = (t, kind, minS = 0.3) => {                 // most recent event of a kind → {e, age}
    let r = null; for (const e of EV) if (e.kind === kind && e.strength >= minS && e.t <= t) r = e;
    return r ? { e: r, age: t - r.t } : { e: null, age: 1e9 };
  };
  const loud = t => {
    const L = B.loudness; if (!L.length) return 0.5;
    const f = t * B.fps, i = Math.floor(f), k = f - i;
    return lerp(L[clamp(i, 0, L.length - 1)], L[clamp(i + 1, 0, L.length - 1)], k);
  };
  const sectionAt = t => B.sections.find(s => t >= s.start && t < s.end) || { label: 'mid', start: 0, end: B.duration };
  const cutAt = t => SB ? SB.cuts.find(c => t >= c.start && t < c.end) || null : null;
  // How much machine to show: full HUD on verses/machine rows, thin on chorus plates.
  const density = t => {
    const c = cutAt(t);
    if (c) return c.layer === 'plate' && !c.pip ? (c.section === 'chorus' ? 0.3 : 0.55) : 1;
    return sectionAt(t).label === 'high' ? 0.45 : 1;
  };

  // ---------- VOCAB: the machine parts ----------
  function ribbon(t, d) {
    if (WORLD) return;                                   // the 3D layer draws silk ribbons instead
    const L = loud(t), strands = 7, y0 = H * 0.68;
    g.lineCap = 'round';
    for (let s = 0; s < strands; s++) {
      const ph = s * 0.9, amp = (30 + 140 * L) * (0.6 + 0.4 * Math.sin(t * 0.7 + s));
      g.beginPath();
      for (let x = -20; x <= W + 20; x += 16) {
        const u = x / W;
        const y = y0 + Math.sin(u * 6.0 + t * 1.3 + ph) * amp * 0.6
                     + Math.sin(u * 13.0 - t * 2.1 + ph * 2) * amp * 0.25
                     + Math.sin(u * 2.0 + t * 0.4) * 40 + (s - strands / 2) * (4 + 10 * L);
        x === -20 ? g.moveTo(x, y) : g.lineTo(x, y);
      }
      const hot = s === 3;
      g.strokeStyle = alpha(hot && L > 0.8 ? C.warn : C.cool, (hot ? 0.9 : 0.25 + 0.1 * s / strands) * d);
      g.lineWidth = hot ? 1.5 + 5 * L : 1;
      g.stroke();
    }
  }

  function tickRail(t, d) {
    const y = H - 70, span = 8, px = W / span; // 8 s visible, playhead at centre
    g.strokeStyle = alpha(C.dim, 0.9 * d); g.lineWidth = 1;
    g.beginPath(); g.moveTo(96, y); g.lineTo(W - 96, y); g.stroke();
    const draw = (arr, h, col, a) => {
      for (const b of arr) {
        const x = W / 2 + (b - t) * px; if (x < 96 || x > W - 96) continue;
        const near = Math.exp(-Math.abs(b - t) * 8);
        g.strokeStyle = alpha(col, (a + near) * d);
        g.beginPath(); g.moveTo(x, y - h - 10 * near); g.lineTo(x, y); g.stroke();
      }
    };
    draw(B.beats, 8, C.dim, 0.6); draw(B.downbeats, 22, C.cool, 0.5);
    g.fillStyle = alpha(C.warn, d); g.fillRect(W / 2 - 1, y - 34, 2, 44);
  }

  // ---------- COPY: every non-lyric string lives here (spell-checked) ----------
  const COPY = {
    job: 'BUILD #0412', repo: 'compile-the-future / main', title: ['COMPILE', 'THE FUTURE'],
    stages: ['PLAN', 'CODE', 'TEST', 'SHIP'], passed: 'ALL CHECKS PASSED',
    credits: 'MUSIC · SUNO     PLATES · GEMINI + VEO     MOTION · CODE',
    who: { c: 'THE CODER', a: 'THE ARCHITECT', o: 'THE ORCHESTRATOR', ao: 'ARCHITECT + ORCHESTRATOR', p: 'THE PRINCIPAL',
           f: 'THE FIXER', crew: 'THE CREW' },
    log: ['plan › split feature into 8 branches', 'agent › spawn worker pool', 'test › auth/session ✓', 'lint › 0 issues',
          'merge › lane 12 → main', 'trace › p99 41ms', 'refactor › core/compiler', 'cache › hit 97.2%', 'test › parser ✓',
          'agent › retry lane 7', 'build › link 2,048 modules', 'deploy › canary 5%', 'test › e2e checkout ✓', 'agent › handoff 31 → 32',
          'gc › freed 1.2 GB', 'infer › 18k tok/s', 'review › approve diff #883', 'test › fuzz 10k cases ✓',
          'policy › ethical acceleration ✓'],
    // the ending (after the end card): a release, in the video's own language
    ethics: { tag: '$ git tag -a v1.0 -m "ethical acceleration"', push: '$ git push --tags', checks: ['BUILD', 'TEST', 'ETHICS REVIEW', 'SHIP'],
              board: ['ETHICAL', 'ACCELERATION'], boardTitle: 'NEXT RELEASE · FOR EVERYONE', boardTag: '#ethacc',
              call: 'SPREAD AWARENESS!', hash: '#ethacc' },
    // hidden whispers: barely-there text for the ones who look closely (time s, text, place, alpha)
    whispers: [[11.5, 'ETHICAL ACCELERATION', 'rail', 0.16], [47.0, '#ethacc', 'right', 0.14], [66.5, 'ethical acceleration', 'under-build', 0.15],
               [99.0, 'ETHICAL ACCELERATION', 'left', 0.13], [128.5, '#ethacc', 'rail', 0.16], [160.5, 'ethical acceleration', 'right', 0.13],
               [195.5, 'ETHICAL ACCELERATION', 'under-build', 0.14], [238.0, '#ethacc', 'left', 0.14], [262.0, 'ethical acceleration', 'rail', 0.15],
               [285.0, 'ETHICAL ACCELERATION', 'right', 0.12]],
  };

  // ---------- THE BUILD: the through-line pipeline status (keyframes by song section) ----------
  // st: status word, col: token, p: progress at section start -> end, ag: agents at start -> end, stage: active stage
  const BUILD_KF = {
    intro:     { st: 'QUEUED',      col: 'dim',  p: [0, 0],    ag: [1, 1],       stage: 0 },
    verse1:    { st: 'RUNNING',     col: 'cool', p: [0, 6],    ag: [1, 1],       stage: 0 },
    pre1:      { st: 'BRANCHING',   col: 'mag',  p: [6, 20],   ag: [2, 64],      stage: 1 },
    chorus1:   { st: 'RUNNING',     col: 'cool', p: [20, 37],  ag: [64, 1024],   stage: 1 },
    drop1:     { st: 'WARN · THERMAL', col: 'warn', p: [37, 58], ag: [1024, 2048], stage: 1 },
    inter1:    { st: 'RUNNING',     col: 'cool', p: [58, 61],  ag: [2048, 2048], stage: 2 },
    verse2:    { st: 'TESTS',       col: 'cool', p: [61, 72],  ag: [2048, 4096], stage: 2, fail: 3 },
    pre2:      { st: 'RETRY',       col: 'warn', p: [72, 80],  ag: [4096, 4096], stage: 2, fail: 2 },
    chorus2:   { st: 'FAIL · OVERHEAT', col: 'mag', p: [80, 88], ag: [4096, 8192], stage: 2, fail: 1, blink: 1 },
    breakdown: { st: 'CONVERGING',  col: 'cool', p: [88, 99],  ag: [8192, 1],    stage: 2 },
    build:     { st: 'DEPLOYING',   col: 'signal', p: [100, 100], ag: [1, 1],    stage: 3 },
    final:     { st: 'LIVE',        col: 'signal', p: [100, 100], ag: [1, 1],    stage: 3 },
    tag:       { st: 'LIVE · SCALING', col: 'signal', p: [100, 100], ag: [1, 1], stage: 3 },
    outro:     { st: 'LIVE · 1 WORLD', col: 'signal', p: [100, 100], ag: [1, 1], stage: 3 },
    end:       { st: 'LIVE · 1 WORLD', col: 'signal', p: [100, 100], ag: [1, 1], stage: 3 },
  };
  let GREEN_T = 199.5;                                        // the sung word "check" (set from lyrics-words in load)
  const songSec = t => (SB?.song_map || []).find(s => t >= s.start && t < s.end) || { name: 'intro', start: 0, end: 1 };
  function buildState(t) {
    const s = songSec(t), K = BUILD_KF[s.name] || BUILD_KF.intro, u = clamp((t - s.start) / Math.max(0.01, s.end - s.start));
    let st = K.st, col = C[K.col], p = lerp(K.p[0], K.p[1], u), ag = Math.round(K.ag[0] * Math.pow(K.ag[1] / K.ag[0], u));
    let stage = K.stage, fail = K.fail || 0, green = 0;
    if (s.name === 'breakdown' && t >= GREEN_T) { st = 'PASSED ✔'; col = C.signal; p = 100; ag = 1; stage = 3; fail = 0; }
    if (t >= GREEN_T) green = 1;
    return { st, col, p, ag, stage, fail, blink: K.blink, green, sec: s };
  }
  function buildPanel(t) {
    const b = buildState(t), on = ease((t - 0.8) / 1.2) * (1 - ease((t - (SB?.markers?.end_card ?? 1e9)) / 0.6));
    if (on <= 0) return;
    const ck = cardK(t), A = on * (1 - 0.35 * ck), x = 96, y = 54;
    g.save(); g.filter = 'blur(22px)'; g.fillStyle = `rgba(0,0,0,${0.45 * A})`; g.fillRect(x - 30, y - 20, 520, 170); g.restore();
    label(`${COPY.job} · ${COPY.repo}`, x, y + 14, C.type, 0.55 * A, 15);
    // status word + LED (blinks on FAIL; flips green on the check)
    const blink = b.blink ? (Math.floor(t * B.bpm / 60 * 2) % 2 ? 1 : 0.35) : 1;
    const gk = b.green ? clamp((t - GREEN_T) / 0.15) : 0;
    g.fillStyle = alpha(b.col, A * blink); g.shadowColor = b.col; g.shadowBlur = 14 + 30 * Math.exp(-(t - GREEN_T) * 2) * gk;
    g.beginPath(); g.arc(x + 9, y + 44, 8, 0, Math.PI * 2); g.fill(); g.shadowBlur = 0;
    label(b.st, x + 28, y + 58, b.col, A * (0.4 + 0.6 * blink), 40, 'left', FONT_D, 800);
    // progress bar
    const bw = 400, py = y + 82;
    g.fillStyle = alpha(C.dim, 0.7 * A); g.fillRect(x, py, bw, 6);
    g.fillStyle = alpha(b.col, A); g.fillRect(x, py, bw * b.p / 100, 6);
    label(`${b.p.toFixed(0).padStart(3, ' ')}%`, x + bw + 14, py + 8, C.type, 0.8 * A, 16);
    label(`AGENTS ${b.ag.toLocaleString('en-US')}`, x, py + 32, C.type, 0.7 * A, 16);
    if (b.fail) label(`${b.fail} FAILING`, x + 200, py + 32, C.mag, A * (b.blink ? blink : 1), 16);
    // stage chips
    COPY.stages.forEach((sname, i) => {
      const cx = x + i * 100, on2 = i <= b.stage, cur = i === b.stage;
      g.strokeStyle = alpha(on2 ? b.col : C.dim, A * (cur ? 1 : 0.6)); g.lineWidth = cur ? 2 : 1;
      g.strokeRect(cx, py + 46, 88, 24);
      if (cur) { g.fillStyle = alpha(b.col, 0.18 * A); g.fillRect(cx, py + 46, 88, 24); }
      label(sname, cx + 44, py + 64, on2 ? C.type : C.dim, A * (on2 ? 0.9 : 0.6), 14, 'center');
    });
  }

  function hud(t, d) {
    const s = songSec(t), c = cutAt(t);
    g.font = `500 16px ${FONT_M}`; g.textBaseline = 'top'; g.textAlign = 'right';
    const tc = `${String(Math.floor(t / 60)).padStart(2, '0')}:${(t % 60).toFixed(2).padStart(5, '0')}`;
    g.fillStyle = alpha(C.type, 0.7 * d); g.fillText(`T ${tc}   ${B.bpm.toFixed(0)} BPM`, W - 96, 54);
    g.fillStyle = alpha(C.cool, 0.8 * d); g.fillText((s.chapter || s.name).toUpperCase(), W - 96, 78);
    const db = last(t, B.downbeats).i;
    g.fillStyle = alpha(C.type, 0.45 * d);
    g.fillText(`NODE ${String(Math.floor(rand(db) * 9000 + 1000))} · GPU ${(55 + loud(t) * 40).toFixed(0)}°C · LOAD ${(loud(t) * 100).toFixed(0).padStart(3, '0')}`, W - 96, 102);
    g.textAlign = 'left';
  }

  // agent log: small lines scrolling on the beat (bottom right), seeded by beat index
  function agentLog(t, d) {
    if (d < 0.05) return;
    const bt = last(t, B.beats), n = 6, x = W - 96, y0 = H - 250;
    g.font = `500 15px ${FONT_M}`; g.textAlign = 'right'; g.textBaseline = 'alphabetic';
    for (let k = 0; k < n; k++) {
      const i = bt.i - k; if (i < 0) break;
      const line = COPY.log[Math.floor(hash(i, 5) * COPY.log.length)], id = String(Math.floor(hash(i, 6) * 999)).padStart(3, '0');
      const rise = k === 0 ? (1 - ease(bt.age / 0.15)) * 22 : 0;
      const col = line.includes('retry') ? C.warn : line.includes('✓') ? C.cool : k % 3 === 1 ? C.mag : C.type;
      g.fillStyle = alpha(col, d * (k === 0 ? 0.95 : 0.6 - k * 0.08));
      g.fillText(`a-${id} ${line}`, x, y0 + (n - 1 - k) * 22 + rise);
    }
    g.textAlign = 'left';
  }

  // ---------- HIGHLIGHT LYRICS (assets/overlay/highlights.json) ----------
  // Cards, not subtitles: ~1 in 3 phrases. style: type | flap | slam | anchor. Per-character timing from the
  // forced-aligned words: nothing appears before it is sung.
  let WORDS = [], HL = [], CARD_RECT = null;
  function anchorTime(spec, isEnd) {                          // '@N' phrase index, '@N$' its end, '+x' offset, number = s
    if (typeof spec === 'number') return spec;
    let [txt, plus] = String(spec).split('+');
    let v = null;
    if (txt.startsWith('@')) { const e = txt.endsWith('$'), i = parseInt(txt.slice(1)); const l = LYR[i]; if (l) v = e ? l.end : l.t; }
    else if (txt.trim() !== '' && !isNaN(+txt)) v = +txt;
    else { let n = 1; if (txt.includes('#')) { const [x, y] = txt.split('#'); txt = x; n = +y; }
      const h = LYR.filter(l => l.text.toLowerCase().startsWith(txt.trim().toLowerCase()))[n - 1]; if (h) v = isEnd ? h.end : h.t; }
    if (v == null) { console.error('anchor not found:', spec); return null; }
    return v + (plus ? +plus : 0);
  }
  function resolveHighlights(def) {
    HL = [];
    for (const c of (def?.cards || [])) {
      const t0 = anchorTime(c.from), t1 = c.to != null ? anchorTime(c.to, true) : (typeof c.from === 'string' && c.from.startsWith('@') ? anchorTime(c.from + '$') : null);
      if (t0 == null || t1 == null || !(t1 > t0)) { console.error('bad card', c); continue; }
      const rows = c.text.split('/').map(r => r.trim());
      const toks = rows.flatMap((r, ri) => r.split(/\s+/).map(w => ({ w, row: ri })));
      const ws = WORDS.filter(w => w.start >= t0 - 0.08 && w.start < t1 - 0.05);
      let tt;
      if (ws.length === toks.length) tt = ws.map(w => [Math.max(w.start, t0), Math.max(w.end, w.start + 0.12)]);
      else { const span = (t1 - t0) * 0.75; tt = toks.map((_, i) => [t0 + span * i / toks.length, t0 + span * (i + 1) / toks.length]); }
      HL.push({ ...c, t0, t1, rows, toks, tt, hold: c.hold ?? 0.35 });
    }
    HL.sort((a, b) => a.t0 - b.t0);
    for (let i = 0; i < HL.length; i++) {                     // a card ends before the next one starts
      const nx = HL[i + 1]; HL[i].tEnd = Math.min(HL[i].t1 + HL[i].hold, nx ? nx.t0 - 0.05 : 1e9);
    }
  }
  const cardAt = t => { for (const c of HL) if (t >= c.t0 - 0.01 && t < c.tEnd + 0.3) return c; return null; };
  const cardEnv = (c, t) => clamp((t - c.t0) / 0.08) * (1 - clamp((t - c.tEnd) / 0.3));
  const cardK = t => { const c = cardAt(t); return c ? cardEnv(c, t) : 0; };
  // per-character ages: token k's letters appear across min(word duration, 0.4 s) from its start
  function charTimes(c, t) {
    return c.toks.map((tk, k) => {
      const [a, b] = c.tt[k], dur = Math.min(0.4, Math.max(0.08, b - a));
      return [...tk.w].map((ch, j) => ({ ch, age: t - (a + dur * j / tk.w.length), row: tk.row }));
    });
  }
  function backing(x, y, w, h, a) {
    g.save(); g.filter = 'blur(26px)'; g.fillStyle = `rgba(0,0,0,${0.55 * a})`; g.fillRect(x - 40, y - 30, w + 80, h + 60); g.restore();
  }
  // where a card sits: explicit pos, else left of an active scene, else opposite the performer, else centre
  function cardSide(c) {
    if (c.pos && c.pos !== 'auto') return c.pos;
    if (sceneAt(c.t0 + 0.05)) return 'left';
    const p = plateAt(c.t0 + 0.05);
    if (p?.s.person?.bbox) { const [bx, , bw] = p.s.person.bbox, cx = p.map(bx + bw / 2, 0.5)[0]; return cx > W / 2 ? 'left' : 'right'; }
    return 'center';
  }
  function typeCard(c, t, e) {
    const side = cardSide(c), size = c.size || 46, lh = size * 1.25, x = side === 'right' ? 1060 : 96;
    const y0 = (c.y ?? 0.62) * H;
    const ct = charTimes(c, t);
    g.font = `400 ${size}px ${FONT_M}`; g.textBaseline = 'alphabetic';
    const rows = c.rows.map(() => '');
    let lastAge = 1e9, lastRow = 0;

      label(E.boardTitle, x0 + 20, y0 + 36, C.warn, bk, 18); label(E.boardTag, x0 + bw - 20, y0 + 36, C.cool, bk, 18, 'right');
      E.board.forEach((row, ri) => {
        const pad = Math.floor((ncol - row.length) / 2), rw = ' '.repeat(pad) + row + ' '.repeat(ncol);
        for (let i = 0; i < ncol; i++) {
          const ch = rw[i], x = x0 + 20 + i * (tw + gap), y = y0 + 56 + ri * (th + 12);
          const st = 5.7 + ri * 0.6 + i * 0.045, nf = 4 + Math.floor(hash(i + ri * 17, 3) * 3), fd = 0.08, a2 = age - st;
          let A = ' ', Bc = ' ', phi = 0;
          if (a2 > 0) { const f2 = Math.floor(a2 / fd);
            if (f2 >= nf) { A = Bc = ch; phi = 1; }
            else { const r0 = n => n < 0 ? ' ' : FLAPCH[Math.floor(hash(i * 7 + ri * 13 + n, 9) * FLAPCH.length)];
              A = r0(f2 - 1); Bc = f2 === nf - 1 ? ch : r0(f2); phi = (a2 - f2 * fd) / fd; } }
          flapTile(x, y, tw, th, A, Bc, phi, ch === ' ' ? '#000' : C.type, bk);
        }
      });
    }
    // the call
    const ck = ease((age - 8.0) / 0.5) * out;
    if (ck > 0) {
      g.save(); if ('letterSpacing' in g) g.letterSpacing = '6px';
      g.shadowColor = 'rgba(0,0,0,0.6)'; g.shadowBlur = 30;
      label(E.call, 96, y0 + bh + 110 + 20 * (1 - ck), C.type, ck, 92, 'left', FONT_D, 900);
      g.restore(); if ('letterSpacing' in g) g.letterSpacing = '0px';
      label(E.hash, 100, y0 + bh + 170, C.cool, ease((age - 8.6) / 0.4) * out, 40, 'left', FONT_M, 400);
    }
  }

  // ---------- SCENES: lyric-driven graphics (take over from the HUD, then hand back) ----------
  // Each scene is (t, k, s) → draws, k = fade envelope 0..1, s = {start, end, age, u} with u = progress 0..1.
  // Stage = the right half (SX, SY centre); highlight cards sit left. Timing: assets/overlay/scenes.json.
  const SX = 1400, SY = 540, RX = SX, RY = SY;
  const label = (txt, x, y, col, a, size = 18, align = 'left', font = FONT_M, weight = 600) => {
    g.font = `${weight} ${size}px ${font}`; g.textAlign = align; g.textBaseline = 'alphabetic';
    g.fillStyle = alpha(col, a); g.fillText(txt, x, y); g.textAlign = 'left';
  };
  const stageTag = (txt, k, col = C.warn) => {                // small amber tag at the top of the stage
    label(txt, SX - 420, 200, col, 0.9 * k, 16); g.fillStyle = alpha(col, 0.6 * k); g.fillRect(SX - 420, 210, 60, 2);
  };
  const bt = t => last(t, B.beats), dbt = t => last(t, B.downbeats);
  const line = (x0, y0, x1, y1) => { g.beginPath(); g.moveTo(x0, y0); g.lineTo(x1, y1); g.stroke(); };
  const dot = (x, y, r) => { g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill(); };
  const glow = (col, b) => { g.shadowColor = col; g.shadowBlur = b; };

  // binary agent tree: root left, 64 leaves right. grow = depth shown (0..6), prune = 0..1, flow = returns pulsing
  function tree(t, k, grow, prune, flow) {
    const D = 6, x0 = SX - 400, x1 = SX + 400, top = 230, bot = 850;
    const nodeY = (d, i) => top + (bot - top) * (i + 0.5) / Math.pow(2, d), nodeX = d => x0 + (x1 - x0) * d / D;
    const weak = (d, i) => d >= 3 && hash(i + d * 100, 21) < 0.32;      // weak paths (pruned in "test it, trim it")
    const deadAt = (d, i) => { for (let dd = d, ii = i; dd >= 3; dd--, ii >>= 1) if (weak(dd, ii)) return hash(ii + dd * 100, 22); return 2; };
    g.lineWidth = 2;
    for (let d = 1; d <= D; d++) {
      const gk = clamp(grow - (d - 1));
      if (gk <= 0) break;
      for (let i = 0; i < Math.pow(2, d); i++) {
        const px = nodeX(d - 1), py = nodeY(d - 1, i >> 1), nx = nodeX(d), ny = nodeY(d, i);
        const dead = prune > deadAt(d, i), col = (i + d) % 2 ? C.cool : C.mag;
        g.strokeStyle = alpha(dead ? C.dim : col, k * (dead ? 0.35 : 0.75));
        const ex = lerp(px, nx, ease(gk)), ey = lerp(py, ny, ease(gk));
        g.beginPath(); g.moveTo(px, py); g.bezierCurveTo(px + (nx - px) * 0.5, py, px + (nx - px) * 0.5, ey, ex, ey); g.stroke();
        g.fillStyle = alpha(dead ? C.dim : C.type, k); dot(ex, ey, d === D ? 3.5 : 3);
        if (dead && weak(d, i) && d === 3 + Math.floor(hash(i, 23) * 0) ) {}
        if (dead && weak(d, i)) { g.strokeStyle = alpha(C.mag, k * clamp((prune - deadAt(d, i)) * 6)); line(ex - 8, ey - 8, ex + 8, ey + 8); line(ex - 8, ey + 8, ex + 8, ey - 8); }
        if (flow > 0 && !dead && d === D) {                   // a return pulse travels leaf -> root
          const ph = (flow * 1.4 + hash(i, 24)) % 1;
          let dd = D, ii = i, xa = nx, ya = ny; const steps = ph * D, sd = Math.floor(steps), f = steps - sd;
          for (let s2 = 0; s2 < sd; s2++) { ii >>= 1; dd--; xa = nodeX(dd); ya = nodeY(dd, ii); }
          const xb = nodeX(Math.max(0, dd - 1)), yb = nodeY(Math.max(0, dd - 1), ii >> 1);
          g.fillStyle = alpha(C.type, k); glow(C.cool, 12); dot(lerp(xa, xb, f), lerp(ya, yb, f), 4); g.shadowBlur = 0;
        }
      }
    }
    g.fillStyle = alpha(C.cool, k); glow(C.cool, 10 + (flow > 0 ? 20 * Math.exp(-bt(t).age * 6) : 0)); dot(x0, (top + bot) / 2, 9); g.shadowBlur = 0;
    const leaves = Math.pow(2, Math.min(D, Math.floor(grow)));
    label(`AGENTS ${leaves}`, x0, 900, C.type, 0.8 * k, 18);
  }

  const SCENES = {
    cursor(t, k, s) {                                         // a terminal, one cursor, a held breath
      const x0 = SX - 360, y0 = 300, w = 720, h = 420;
      g.strokeStyle = alpha(C.dim, k); g.lineWidth = 1.5; g.strokeRect(x0, y0, w, h);
      g.fillStyle = alpha(C.dim, 0.5 * k); g.fillRect(x0, y0, w, 30);
      label('tty1 — ~/compile-the-future', x0 + 14, y0 + 21, C.type, 0.6 * k, 14);
      const blink = (Math.floor(t * B.bpm / 60) % 2 === 0) ? 1 : 0.15;
      label('$', x0 + 30, y0 + 100, C.cool, k, 40, 'left', FONT_M, 400);
      g.fillStyle = alpha(C.cool, k * blink); glow(C.cool, 24 * blink); g.fillRect(x0 + 66, y0 + 66, 24, 40); g.shadowBlur = 0;
      const br = 0.5 - 0.5 * Math.cos(s.age * 2 * Math.PI / 6);  // a slow breath
      g.strokeStyle = alpha(C.cool, 0.6 * k); g.lineWidth = 2; g.beginPath();
      for (let x = 0; x <= w - 60; x += 6) { const u = x / (w - 60); g.lineTo(x0 + 30 + x, y0 + h - 90 - br * 50 * Math.sin(u * Math.PI)); }
      g.stroke();
      label(s.start > 200 ? 'PULSE · 152 BPM' : 'AWAITING INPUT', x0 + 30, y0 + h - 24, C.type, 0.5 * k, 14);
    },
    oneline(t, k, s) {                                        // the whole world pinned to one line
      stageTag('SCOPE · WORLD → 1 LINE', k);
      const f = ease((s.u - 0.15) / 0.6), R = 260;
      for (let i = 0; i < 500; i++) {
        const la = Math.acos(1 - 2 * hash(i, 31)), lo = hash(i, 32) * 6.283 + t * 0.4;
        const x = SX + Math.sin(la) * Math.cos(lo) * R, y = SY + Math.cos(la) * R, z = Math.sin(la) * Math.sin(lo);
        const tx = SX - 380 + 760 * (i / 500);
        g.fillStyle = alpha(z > 0 ? C.cool : C.dim, k * (0.5 + 0.5 * f));
        dot(lerp(x, tx, f), lerp(y, SY, f), 2);
      }
      if (f > 0.95) { g.strokeStyle = alpha(C.cool, k); glow(C.cool, 16); g.lineWidth = 3; line(SX - 380, SY, SX + 380, SY); g.shadowBlur = 0; }
    },
    minds(t, k, s) {                                          // one instruction, then little minds wake up
      label('$ build --agents --parallel', SX - 400, 260, C.cool, k, 30, 'left', FONT_M, 400);
      const tm = anchorTime('@9') ?? s.start + 3, b0 = last(tm, B.beats).i, nb = bt(t).i - b0;
      const cols = 8, rows = 5;
      for (let i = 0; i < cols * rows; i++) {
        const x = SX - 350 + (i % cols) * 100, y = 380 + Math.floor(i / cols) * 100;
        const wake = t >= tm && i < (nb + 1) * 3, age = wake ? t - (B.beats[b0 + Math.floor(i / 3)] ?? tm) : 0;
        g.strokeStyle = alpha(C.dim, k); g.lineWidth = 1.5; g.beginPath(); g.arc(x, y, 18, 0, 6.283); g.stroke();
        if (wake) { const col = i % 3 ? C.cool : C.mag; g.fillStyle = alpha(col, k); glow(col, 20 * Math.exp(-age * 3)); dot(x, y, 10 + 6 * Math.exp(-age * 5)); g.shadowBlur = 0; }
      }
      label(`MINDS AWAKE ${Math.min(cols * rows, t >= tm ? (nb + 1) * 3 : 0)}/${cols * rows}`, SX - 400, 900, C.type, 0.8 * k, 18);
    },
    branch(t, k, s) { stageTag('AGENT TREE · BRANCHING', k, C.mag); tree(t, k, 0.5 + s.u * 6.2, 0, 0); },
    prune(t, k, s) { stageTag('TEST · TRIM WEAK PATHS', k); tree(t, k, 7, ease(s.u * 1.3), 0); },
    flow(t, k, s) { stageTag('RETURNS → MAIN', k, C.cool); tree(t, k, 7, 1, s.age / 2.5); },
    spark(t, k, s) {                                          // a spark grows into circuit traces and chips
      stageTag('SPARK → MACHINE', k);
      const gr = ease(s.u * 1.2), sp = Math.exp(-s.age * 3);
      for (let i = 0; i < 12; i++) {
        const a = i / 12 * 6.283 + 0.2, l1 = 120 + hash(i, 41) * 120, l2 = 80 + hash(i, 42) * 160;
        const x1 = SX + Math.cos(a) * l1, y1 = SY + Math.sin(a) * l1 * 0.8;
        const hx = Math.abs(Math.cos(a)) > 0.5, x2 = hx ? x1 + Math.sign(Math.cos(a)) * l2 : x1, y2 = hx ? y1 : y1 + Math.sign(Math.sin(a)) * l2 * 0.6;
        const L1 = clamp(gr * 2), L2 = clamp(gr * 2 - 1);
        g.strokeStyle = alpha(i % 4 ? C.cool : C.mag, k * 0.85); g.lineWidth = 2;
        line(SX, SY, lerp(SX, x1, L1), lerp(SY, y1, L1)); if (L2 > 0) line(x1, y1, lerp(x1, x2, L2), lerp(y1, y2, L2));
        if (L2 >= 1) { g.strokeRect(x2 - 12, y2 - 12, 24, 24); g.fillStyle = alpha(C.type, k * (0.4 + 0.6 * Math.exp(-bt(t).age * 6))); g.fillRect(x2 - 4, y2 - 4, 8, 8); }
      }
      g.fillStyle = alpha(C.warn, k); glow(C.warn, 30 + 40 * sp); dot(SX, SY, 10 + 20 * sp); g.shadowBlur = 0;
    },
    tokens(t, k, s) {                                         // tokens fly in one by one and align into a grid
      stageTag('TOKEN STREAM · ALIGN', k, C.cool);
      const TK = ['fn', '=>', 'let', '{', '}', 'map', 'ok', 'ret', '0x1f', 'agt', 'ctx', 'run', '&&', 'pub', 'use', 'mod', 'dyn', 'impl'];
      const cols = 8, rows = 6, n = cols * rows;
      g.font = `400 18px ${FONT_M}`; g.textAlign = 'center'; g.textBaseline = 'middle';
      for (let i = 0; i < n; i++) {
        const a = clamp((s.u * 1.5 - i / n * 0.9) / 0.25), e = ease(a); if (a <= 0) continue;
        const gx = SX - 350 + (i % cols) * 100, gy = 300 + Math.floor(i / cols) * 80;
        const sx = SX + 500 + hash(i, 51) * 200, sy = 200 + hash(i, 52) * 700;
        const x = lerp(sx, gx, e), y = lerp(sy, gy, e) + (1 - e) * Math.sin(t * 5 + i) * 30;
        const col = i % 5 === 0 ? C.mag : C.cool;
        g.strokeStyle = alpha(col, k * (0.4 + 0.6 * e)); g.lineWidth = 1.5; g.strokeRect(x - 40, y - 22, 80, 44);
        if (e > 0.98 && a < 1.1) { g.fillStyle = alpha(col, 0.2 * k); g.fillRect(x - 40, y - 22, 80, 44); }
        g.fillStyle = alpha(C.type, k * e); g.fillText(TK[i % TK.length], x, y);
      }
      g.textAlign = 'left';
      label(`TOKENS ${Math.floor(clamp(s.u * 1.5) * 48 * 1024).toLocaleString('en-US')}`, SX - 390, 900, C.type, 0.8 * k, 18);
    },
    ship(t, k, s) {                                           // ship before the dawn: deploy rises over the horizon
      stageTag('DEPLOY › PROD', k);
      const hy = 720;
      g.strokeStyle = alpha(C.dim, k); g.lineWidth = 2; line(SX - 420, hy, SX + 420, hy);
      g.strokeStyle = alpha(C.warn, 0.35 * k); g.lineWidth = 2;
      for (let r = 0; r < 4; r++) { g.beginPath(); g.arc(SX + 200, hy, 120 + r * 40 + s.u * 10, Math.PI, 2 * Math.PI); g.stroke(); }
      const up = ease(s.u * 1.1), py = hy - 30 - up * 380, px = SX - 120;
      g.strokeStyle = alpha(C.cool, k); g.lineWidth = 2.5;
      g.strokeRect(px - 40, py - 40, 80, 80); line(px - 40, py - 40, px - 20, py - 60); line(px + 40, py - 40, px + 60, py - 60);
      line(px - 20, py - 60, px + 60, py - 60); line(px + 60, py - 60, px + 60, py + 20); line(px + 40, py + 40, px + 60, py + 20);
      for (let i = 0; i < 14; i++) { const yy = py + 50 + i * 22; if (yy > hy) break; g.fillStyle = alpha(C.cool, k * (1 - i / 14)); g.fillRect(px - 2, yy, 4, 12); }
      const eta = Math.max(0, 134 - s.age * 40);
      label(`SHIPPED v2.${dbt(t).i % 40}.0   DAWN IN ${String(Math.floor(eta / 60)).padStart(2, '0')}:${String(Math.floor(eta % 60)).padStart(2, '0')}`, SX - 420, hy + 50, C.type, 0.8 * k, 18);
    },
    thread(t, k, s) {                                         // one bright thread weaves through the grid
      stageTag('ONE THREAD · IN-BETWEEN', k, C.cool);
      for (let i = 0; i < 9; i++) for (let j = 0; j < 7; j++) { g.fillStyle = alpha(C.dim, k); dot(SX - 400 + i * 100, 260 + j * 90, 3); }
      const n = 200, on = ease(s.u * 1.3) * n;
      g.strokeStyle = alpha(C.cool, k); g.lineWidth = 3; glow(C.cool, 14); g.beginPath();
      let hx = 0, hy = 0;
      for (let i = 0; i <= on; i++) { const u = i / n; hx = SX - 400 + u * 800; hy = SY + Math.sin(u * 18.85) * 45 + Math.sin(u * 5) * 120; i ? g.lineTo(hx, hy) : g.moveTo(hx, hy); }
      g.stroke(); g.fillStyle = alpha(C.type, k); dot(hx, hy, 6); g.shadowBlur = 0;
    },
    design(t, k, s) {                                         // loose lines snap into a clean grid
      stageTag('LINT · 0 ISSUES', k);
      for (let i = 0; i < 36; i++) {
        const a = ease(clamp((s.u * 1.6 - (i % 6) * 0.08 - Math.floor(i / 6) * 0.03) / 0.3));
        const tx = SX - 330 + (i % 6) * 132, ty = 300 + Math.floor(i / 6) * 90, tw = 110;
        const rx = SX + (hash(i, 61) - 0.5) * 800, ry = SY + (hash(i, 62) - 0.5) * 600, ang = (hash(i, 63) - 0.5) * 3, rl = 60 + hash(i, 64) * 120;
        const cx = lerp(rx, tx, a), cy = lerp(ry, ty, a), an = lerp(ang, 0, a), ll = lerp(rl, tw, a);
        g.strokeStyle = alpha(a > 0.98 ? C.cool : C.mag, k * 0.9); g.lineWidth = a > 0.98 ? 4 : 2;
        line(cx - Math.cos(an) * ll / 2, cy - Math.sin(an) * ll / 2, cx + Math.cos(an) * ll / 2, cy + Math.sin(an) * ll / 2);
      }
    },
    thermal(t, k, s) {                                        // the data center smokes: racks heating up
      const hot = songSec(t).name === 'chorus2';
      stageTag(hot ? 'RACK 7 · OVERHEAT · FAILOVER' : 'DATA CENTER · THERMAL', k, hot ? C.mag : C.warn);
      const heat = clamp(0.35 + s.u * 0.7);
      for (let r = 0; r < 3; r++) {
        const x = SX - 330 + r * 230, y0 = 250, w = 170, uh = 46;
        g.strokeStyle = alpha(C.dim, k); g.lineWidth = 2; g.strokeRect(x, y0, w, uh * 12 + 10);
        for (let u = 0; u < 12; u++) {
          const y = y0 + 5 + u * uh, h2 = hash(u + r * 12, 71), temp = clamp(heat * (0.6 + 0.6 * h2) + 0.1 * Math.sin(t * 3 + u));
          g.fillStyle = alpha(temp > 0.85 ? (hot ? C.mag : C.warn) : C.dim, k * (0.25 + 0.5 * temp)); g.fillRect(x + 6, y + 4, (w - 50) * temp, uh - 10);
          const led = hash(u + r * 12 + Math.floor(t * 8), 72) > 0.5;
          g.fillStyle = alpha(temp > 0.85 ? C.warn : C.cool, k * (led ? 1 : 0.3)); dot(x + w - 18, y + uh / 2, 4);
        }
      }
      for (let i = 0; i < 60; i++) {                          // smoke: closed-form rising puffs
        const sp = 60 + hash(i, 73) * 80, ph = (s.age * sp + hash(i, 74) * 700) % 700;
        const x = SX - 330 + hash(i, 75) * 640 + Math.sin(ph / 60 + i) * 30, y = 820 - ph;
        g.fillStyle = `rgba(200,200,200,${0.08 * k * (1 - ph / 700)})`; dot(x, y, 14 + ph / 18);
      }
      label(`GPU ${(78 + heat * 18).toFixed(1)}°C  FANS ${(60 + heat * 40).toFixed(0)}%`, SX - 330, 900, hot ? C.mag : C.warn, k, 22);
    },
    context(t, k, s) {                                        // the context window holds the plan
      const f = ease(s.u * 1.2);
      g.strokeStyle = alpha(C.cool, k); g.lineWidth = 4;
      const bx0 = SX - 400, bx1 = SX + 400, y0 = 260, y1 = 840;
      g.beginPath(); g.moveTo(bx0 + 40, y0); g.lineTo(bx0, y0); g.lineTo(bx0, y1); g.lineTo(bx0 + 40, y1); g.stroke();
      g.beginPath(); g.moveTo(bx1 - 40, y0); g.lineTo(bx1, y0); g.lineTo(bx1, y1); g.lineTo(bx1 - 40, y1); g.stroke();
      const n = Math.floor(f * 120);
      for (let i = 0; i < n; i++) { const x = bx0 + 30 + (i % 12) * 61, y = y0 + 30 + Math.floor(i / 12) * 54;
        const plan = [3, 4, 5, 6, 7, 8, 15, 20, 27, 32, 39, 44, 51, 56, 63, 64, 65, 66, 67, 68].includes(i);
        g.fillStyle = alpha(plan ? C.mag : C.dim, k * (plan ? 0.9 : 0.6)); g.fillRect(x, y, 50, 40); }
      label(`CONTEXT ${Math.floor(f * 182)}k / 200k`, bx0, 890, C.type, 0.8 * k, 18);
    },
    noise(t, k, s) {                                          // inference cuts through the noise
      stageTag('INFERENCE · SIGNAL / NOISE', k);
      const cx = SX - 420 + ease(s.u * 1.2) * 840, fr = Math.floor(t * 15);
      for (let i = 0; i < 400; i++) {
        const x0 = SX - 420 + hash(i, 81) * 840, clean = x0 < cx;
        const y = clean ? SY + Math.sin((x0 - SX) / 60) * 80 : 250 + hash(i * 7 + fr, 82) * 600;
        g.fillStyle = alpha(clean ? C.cool : C.dim, k * (clean ? 0.9 : 0.7)); dot(x0, y, clean ? 3 : 2);
      }
      g.strokeStyle = alpha(C.type, k); g.lineWidth = 2; glow(C.cool, 16); line(cx, 230, cx, 870); g.shadowBlur = 0;
    },
    modules(t, k, s) {                                        // modules click into place on the beat
      stageTag('MODULES · LINKED', k, C.cool);
      const names = ['auth', 'api', 'db', 'ui', 'queue', 'cache', 'infer', 'log', 'core'], b0 = last(s.start, B.beats).i;
      names.forEach((nm, i) => {
        const tb = B.beats[b0 + 1 + i] ?? 1e9, a = t - tb, e = a < 0 ? 0 : spring(a, 22, 0.5);
        const x = SX - 300 + (i % 3) * 210, y = 280 + Math.floor(i / 3) * 190, off = (1 - e) * (i % 2 ? 300 : -300);
        if (a < -1) return;
        g.globalAlpha = clamp(1 + a); g.strokeStyle = alpha(i === 8 ? C.mag : C.cool, k); g.lineWidth = 2.5;
        g.strokeRect(x + off, y, 180, 150);
        if (a >= 0 && a < 0.12) { g.fillStyle = alpha(C.type, 0.4 * k); g.fillRect(x, y, 180, 150); }
        label(nm.toUpperCase(), x + off + 90, y + 85, C.type, k, 26, 'center', FONT_D, 800); g.globalAlpha = 1;
      });
    },
    stack(t, k, s) {                                          // each abstraction earns its voice
      stageTag('ABSTRACTION STACK', k);
      const L = ['SILICON', 'RUNTIME', 'LIBRARY', 'SERVICE', 'PRODUCT'];
      L.forEach((nm, i) => {
        const a = ease(clamp((s.u * 1.4 - i * 0.16) / 0.25)); if (a <= 0) return;
        const y = 800 - i * 120 - (1 - a) * 60, x = SX - 260, w = 520, d = 70;
        g.strokeStyle = alpha(i === 4 ? C.mag : C.cool, k * a); g.lineWidth = 2;
        g.beginPath(); g.moveTo(x, y); g.lineTo(x + w, y); g.lineTo(x + w + d, y - d * 0.6); g.lineTo(x + d, y - d * 0.6); g.closePath(); g.stroke();
        label(nm, x + w + d + 20, y - 10, C.type, k * a, 22, 'left', FONT_D, 800);
      });
    },
    suite(t, k, s) {                                          // run the suite, read every trace
      stageTag('TEST SUITE · 4,096', k, C.cool);
      const T2 = ['auth.session', 'parser.ast', 'agents.spawn', 'lanes.merge', 'cache.evict', 'infer.batch', 'deploy.canary', 'ui.render', 'trace.span', 'core.compile'];
      const per = 60 / B.bpm / 2, n = Math.floor(s.age / per) + 1;

      const dd = d * (1 - sk * (name === 'ribbon' ? 0.6 : 1));
      if (HUD_LAYERS.has(name) && dd <= 0.001) return;
      g.save(); fn(t, dd); g.restore();
    };
    // pass 1: panel layers draw into their offscreen canvases; pass 2: the rest on the main canvas, world3d first
    if (WORLD) for (const [name, fn] of Object.entries(LAYERS)) if (PANEL_OF[name]) { g = PG[PANEL_OF[name]]; run(name, fn); g = main; }
    for (const [name, fn] of Object.entries(LAYERS)) if (!WORLD || !PANEL_OF[name]) run(name, fn);
    return true;
  };

  // ---------- data loading ----------
  async function load() {
    if (window.__DATA__) {
      const D = window.__DATA__;
      if (D.beats) B = D.beats; if (D.lyrics) LYR = D.lyrics; if (D.storyboard) SB = D.storyboard; if (D.features) FEAT = D.features;
      if (D.scenes) window.__SCN = D.scenes;
    } else {
      const get = async (u) => { try { const r = await fetch(u); return r.ok ? r.json() : null; } catch { return null; } };
      B = (await get(qs.get('beats') || '../audio-analysis/beats.json')) || B;
      LYR = (await get(qs.get('lyrics') || 'lyrics.json')) || LYR;
      SB = await get(qs.get('storyboard') || '../../video/storyboard.json');
      window.__SCN = await get(qs.get('scenes') || 'scenes.json');
    }
    LYR = LYR.map(l => ({ ...l, t: l.t ?? l.start })).sort((a, b) => a.t - b.t);
    EV = (SB?.markers?.drops || []).slice().sort((a, b) => a.t - b.t);
    const get2 = async (u) => { try { const r = await fetch(u); return r.ok ? r.json() : null; } catch { return null; } };
    WORDS = (await get2('../audio-analysis/lyrics-words.json')) || [];
    const gw = WORDS.find(w => w.start > 198 && w.text.toLowerCase().startsWith('check')); if (gw) GREEN_T = gw.start;
    const meshSrc = [...new Set((SB?.cuts || []).filter(c => c.overlay?.mesh && c.source).map(c => c.source))];
    for (const src of meshSrc) { const stem = src.split('/').pop().replace(/\.[^.]+$/, '');
      const D = await get2(`../plate-features/depth/${stem}.json`); if (D) DEPTH[src] = D; else console.error('no depth for', src); }
    await initWorld();
    resolveScenes(window.__SCN);
    resolveHighlights(await get2(qs.get('highlights') || 'highlights.json'));
    await Promise.all([document.fonts.load(`900 100px ${FONT_D}`), document.fonts.load(`800 100px ${FONT_D}`), document.fonts.load(`400 40px ${FONT_M}`)]);
    await document.fonts.ready;
  }
  window.ready = load().then(() => { window.seek(0); return true; });

  // live preview only (never used by the renderer): plays the timeline with the wall clock
  if (qs.get('preview')) window.ready.then(() => {
    const t0 = performance.now() / 1000 - (+qs.get('t') || 0);
    const loop = () => { window.seek((performance.now() / 1000 - t0) % B.duration); requestAnimationFrame(loop); };
    loop();
  });
})();
</script>
</body>
