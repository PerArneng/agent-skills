<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>overlay</title>
<!--
  Machine-layer overlay. A pure function of time: window.seek(t) draws song-time t.
  Contract: no timers, no Date.now/performance.now, no requestAnimationFrame, no CSS transitions,
  no unseeded Math.random. Transparent background; assembly composites it over plates.

  Data comes from window.__DATA__ = {beats, lyrics, storyboard} injected by render_overlay.mjs.
  For a live browser preview, serve the project root (npx serve .) and open
  /assets/overlay/overlay.html?preview=1 — it fetches the default paths below and plays the timeline.

  Customise per video: TOKENS (from the bible), the VOCAB section, lyric styling, and SCENES.
  4K: layout is authored in 1920x1080 CSS px; the canvas backing store is devicePixelRatio-scaled, so
  `render_overlay.mjs --scale 2` gives crisp 3840x2160 frames with no layout changes.
  Scenes: lyric-driven graphics that take over from the HUD for specific lines, then hand back to it.
  When = assets/overlay/scenes.json (anchored to lyric phrases), what = the SCENES functions below.
  A HUD that is on screen the whole song gets boring; aim for a scene on most lyric lines that have a concrete image.
-->
<style>
  :root {
    --bg:   #07090C;
    --cool: #7CFFE1;
    --warn: #FFB25A;
    --type: #EDEFF2;
    --dim:  #3A4650;
    --font-display: "Helvetica Neue", "Arial Narrow", Arial, sans-serif;
    --font-mono: Menlo, "SF Mono", Consolas, monospace;
  }
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: transparent; }
  body.green { background: #00FF00; }
  canvas { display: block; width: 1920px; height: 1080px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<canvas id="gl" style="display:none"></canvas>
<!-- 3D layer (optional): three.js + world3d.js, served from disk by render_overlay.mjs (http://overlay.local).
     Copy $SKILL/assets/world3d.js next to this file. ?gl=off or a missing module -> 2D only. -->
<script type="importmap">{"imports": {"three": "/__three/three.module.js", "three/addons/": "/__three_addons/"}}</script>
<script type="module">
  import * as THREE from 'three';
  import { LineSegments2 } from 'three/addons/lines/LineSegments2.js';
  import { LineSegmentsGeometry } from 'three/addons/lines/LineSegmentsGeometry.js';
  import { LineMaterial } from 'three/addons/lines/LineMaterial.js';
  import { createWorld3D } from './world3d.js';
  window.__three = { THREE, LINES: { LineSegments2, LineSegmentsGeometry, LineMaterial }, createWorld3D };
  window.dispatchEvent(new Event('three-ready'));
</script>
<script>
(() => {
  const W = 1920, H = 1080;
  const cv = document.getElementById('c');
  const DPR = window.devicePixelRatio || 1;                  // 2 with render_overlay.mjs --scale 2
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  let g = cv.getContext('2d');                         // let: panel layers draw into offscreen canvases (see seek)
  const qs = new URLSearchParams(location.search);
  if (qs.get('bg') === 'green') document.body.classList.add('green');

  // ---------- tokens (keep names; values come from the bible) ----------
  const css = getComputedStyle(document.documentElement);
  const T = k => css.getPropertyValue(k).trim();
  const C = { bg: T('--bg'), cool: T('--cool'), warn: T('--warn'), type: T('--type'), dim: T('--dim') };
  const FONT_D = T('--font-display'), FONT_M = T('--font-mono');

  // ---------- deterministic helpers ----------
  const hash = (i, s = 0) => { let x = Math.sin(i * 127.1 + s * 311.7) * 43758.5453; return x - Math.floor(x); };
  const rand = (seed) => hash(seed, 7.3);                     // seeded 0..1
  const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
  const lerp = (a, b, k) => a + (b - a) * k;
  const ease = k => 1 - Math.pow(1 - clamp(k), 4);            // ~cubic-bezier(.16,1,.3,1)
  const easeIn = k => Math.pow(clamp(k), 3);                  // for faster exits
  const spring = (age, w = 18, z = 0.45) =>                   // closed-form damped spring 0→1
    age <= 0 ? 0 : 1 - Math.exp(-z * w * age) * Math.cos(w * Math.sqrt(1 - z * z) * age);
  const alpha = (hex, a) => {
    const n = parseInt(hex.replace('#', ''), 16);
    return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${clamp(a)})`;
  };
  // last event at or before t in a sorted array → {i, time, age}
  function last(t, arr) {
    let lo = 0, hi = arr.length - 1, i = -1;
    while (lo <= hi) { const m = (lo + hi) >> 1; if (arr[m] <= t) { i = m; lo = m + 1; } else hi = m - 1; }
    return i < 0 ? { i: -1, time: -1e9, age: 1e9 } : { i, time: arr[i], age: t - arr[i] };
  }

  // ---------- data ----------
  let B = { duration: 60, bpm: 120, fps: 30, beats: [], downbeats: [], onsets: [], strong_onsets: [], loudness: [], sections: [] };
  let LYR = [];      // [{t, text, end?}]
  let SB = null;     // storyboard {cuts:[...]}
  // Music events from scripts/drops.py, passed through storyboard.markers.drops: [{t, kind, strength, dir?}]
  // kind: drop | break | beat_change | build. The storyboard already cuts on them; the overlay hits them too.
  let EV = [];
  const eventNear = (t0, kind, win, minS = 0.3) =>
    EV.find(e => e.kind === kind && e.strength >= minS && Math.abs(e.t - t0) <= win) || null;
  const lastEvent = (t, kind, minS = 0.3) => {                 // most recent event of a kind → {e, age}
    let r = null; for (const e of EV) if (e.kind === kind && e.strength >= minS && e.t <= t) r = e;
    return r ? { e: r, age: t - r.t } : { e: null, age: 1e9 };
  };
  const loud = t => {
    const L = B.loudness; if (!L.length) return 0.5;
    const f = t * B.fps, i = Math.floor(f), k = f - i;
    return lerp(L[clamp(i, 0, L.length - 1)], L[clamp(i + 1, 0, L.length - 1)], k);
  };
  const sectionAt = t => B.sections.find(s => t >= s.start && t < s.end) || { label: 'mid', start: 0, end: B.duration };
  const cutAt = t => SB ? SB.cuts.find(c => t >= c.start && t < c.end) || null : null;
  // How much machine to show: full HUD on verses/machine rows, thin on chorus plates.
  const density = t => {
    const c = cutAt(t);
    if (c) return c.layer === 'plate' && !c.pip ? (c.section === 'chorus' ? 0.3 : 0.55) : 1;
    return sectionAt(t).label === 'high' ? 0.45 : 1;
  };

  // ---------- VOCAB: the machine parts ----------
  function ribbon(t, d) {
    if (WORLD) return;                                   // the 3D layer draws silk ribbons instead
    const L = loud(t), strands = 7, y0 = H * 0.68;
    g.lineCap = 'round';
    for (let s = 0; s < strands; s++) {
      const ph = s * 0.9, amp = (30 + 140 * L) * (0.6 + 0.4 * Math.sin(t * 0.7 + s));
      g.beginPath();
      for (let x = -20; x <= W + 20; x += 16) {
        const u = x / W;
        const y = y0 + Math.sin(u * 6.0 + t * 1.3 + ph) * amp * 0.6
                     + Math.sin(u * 13.0 - t * 2.1 + ph * 2) * amp * 0.25
                     + Math.sin(u * 2.0 + t * 0.4) * 40 + (s - strands / 2) * (4 + 10 * L);
        x === -20 ? g.moveTo(x, y) : g.lineTo(x, y);
      }
      const hot = s === 3;
      g.strokeStyle = alpha(hot && L > 0.8 ? C.warn : C.cool, (hot ? 0.9 : 0.25 + 0.1 * s / strands) * d);
      g.lineWidth = hot ? 1.5 + 5 * L : 1;
      g.stroke();
    }
  }

  function gimbal(t, d) {
    const cx = W * 0.72, cy = H * 0.42, db = last(t, B.downbeats);
    // step rotation: each downbeat kicks the ring a quarter-step, eased
    const kick = (db.i + ease(db.age / 0.35)) * (Math.PI / 8);
    const rings = [
      { r: 300, rate: 0.10, ticks: 120, w: 1, col: C.dim },
      { r: 250, rate: -0.22, ticks: 36, w: 2, col: C.cool, k: 1 },
      { r: 190, rate: 0.35, ticks: 12, w: 1, col: C.cool, k: -1 },
      { r: 120, rate: -0.6, ticks: 4, w: 3, col: C.warn, k: 2 },
    ];
    rings.forEach((R, n) => {
      const a0 = t * R.rate + (R.k || 0) * kick;
      g.save(); g.translate(cx, cy); g.rotate(a0);
      g.strokeStyle = alpha(R.col, 0.75 * d); g.lineWidth = R.w;
      // ring is drawn in arcs with gaps, more mechanical than a full circle
      for (let s = 0; s < 3; s++) { g.beginPath(); g.arc(0, 0, R.r, s * 2.094 + 0.12, s * 2.094 + 1.9); g.stroke(); }
      for (let i = 0; i < R.ticks; i++) {
        const a = i / R.ticks * Math.PI * 2, long = i % 5 === 0;
        g.beginPath(); g.moveTo(Math.cos(a) * R.r, Math.sin(a) * R.r);
        g.lineTo(Math.cos(a) * (R.r - (long ? 14 : 6)), Math.sin(a) * (R.r - (long ? 14 : 6))); g.stroke();
      }
      g.restore();
    });
    // crosshair + pulse on strong onsets
    const so = last(t, B.strong_onsets), p = Math.exp(-so.age * 6);
    g.strokeStyle = alpha(C.type, 0.5 * d); g.lineWidth = 1;
    g.beginPath(); g.moveTo(cx - 340, cy); g.lineTo(cx + 340, cy); g.moveTo(cx, cy - 340); g.lineTo(cx, cy + 340); g.stroke();
    g.fillStyle = alpha(C.warn, (0.2 + 0.8 * p) * d);
    g.beginPath(); g.arc(cx, cy, 6 + 18 * p, 0, Math.PI * 2); g.fill();
  }

  function tickRail(t, d) {
    const y = H - 70, span = 8, px = W / span; // 8 s visible, playhead at centre
    g.strokeStyle = alpha(C.dim, 0.9 * d); g.lineWidth = 1;
    g.beginPath(); g.moveTo(96, y); g.lineTo(W - 96, y); g.stroke();
    const draw = (arr, h, col, a) => {
      for (const b of arr) {
        const x = W / 2 + (b - t) * px; if (x < 96 || x > W - 96) continue;
        const near = Math.exp(-Math.abs(b - t) * 8);
        g.strokeStyle = alpha(col, (a + near) * d);
        g.beginPath(); g.moveTo(x, y - h - 10 * near); g.lineTo(x, y); g.stroke();
      }
    };
    draw(B.beats, 8, C.dim, 0.6); draw(B.downbeats, 22, C.cool, 0.5);
    g.fillStyle = alpha(C.warn, d); g.fillRect(W / 2 - 1, y - 34, 2, 44);
  }

  function hud(t, d) {
    const s = sectionAt(t), c = cutAt(t);
    g.font = `500 18px ${FONT_M}`; g.fillStyle = alpha(C.type, 0.7 * d); g.textBaseline = 'top';
    const tc = `${String(Math.floor(t / 60)).padStart(2, '0')}:${(t % 60).toFixed(2).padStart(5, '0')}`;
    g.fillText(`T ${tc}`, 96, 54);
    g.fillText(`BPM ${B.bpm.toFixed(1)}`, 96, 80);
    g.fillStyle = alpha(C.cool, 0.8 * d);
    g.fillText(`SEC ${(c?.section || s.label).toUpperCase()}`, 96, 106);
    // abstract coordinates, seeded per downbeat so they change on the beat, not every frame
    const db = last(t, B.downbeats).i;
    g.textAlign = 'right'; g.fillStyle = alpha(C.type, 0.5 * d);
    g.fillText(`${(rand(db) * 90).toFixed(4)}N ${(rand(db + 99) * 180).toFixed(4)}E`, W - 96, 54);
    g.fillText(`GAIN ${(loud(t) * 100).toFixed(0).padStart(3, '0')}`, W - 96, 80);
    g.textAlign = 'left';
  }

  function lyric(t) {
    if (!LYR.length) return;
    let cur = null;
    for (let i = LYR.length - 1; i >= 0; i--) if (LYR[i].t <= t) { cur = LYR[i]; break; }
    if (!cur) return;
    const end = cur.end ?? cur.t + 2.5, age = t - cur.t;
    if (t > end) return;
    // a phrase that starts within a beat of a bass drop SLAMS in: overshooting spring, shake, bigger scale
    const slam = eventNear(cur.t, 'drop', 60 / B.bpm);
    const inK = slam ? spring(age, 22, 0.32) : spring(age), outK = easeIn((t - (end - 0.12)) / 0.12); // exit faster than entrance
    const a = clamp(inK) * (1 - outK);
    const scale = slam ? 1.35 - 0.35 * inK : 0.85 + 0.15 * inK;
    const shake = slam && age < 0.25 ? (hash(Math.floor(t * 30), 3) - 0.5) * 18 * (1 - age / 0.25) : 0;
    // position: the active scene's `lyric`, else the cut's overlay.lyric, else left. During a scene the
    // right half is the scene's stage, so a left lyric is width-limited to stay out of it.
    const pos = sceneAt(t)?.s.lyric || cutAt(t)?.overlay?.lyric || 'left';
    const text = cur.text.toUpperCase();
    let size = 132;
    g.font = `800 ${size}px ${FONT_D}`;
    if ('letterSpacing' in g) g.letterSpacing = '6px';
    const maxW = pos === 'center' ? W - 192 : sceneAt(t) ? 740 : W * 0.56;
    const mw = g.measureText(text).width; if (mw > maxW) size = Math.floor(size * maxW / mw);
    g.font = `800 ${size}px ${FONT_D}`;
    const tw = g.measureText(text).width, x = pos === 'right' ? W - 96 - tw : pos === 'center' ? (W - tw) / 2 : 96;
    const y = H * 0.42;
    // soft dark band so the type reads over fog, windows and bright plates (blur = no hard box edges)
    g.save(); g.filter = 'blur(28px)'; g.fillStyle = `rgba(0,0,0,${0.5 * a})`;
    g.fillRect(x - 60, y - size * 0.6, tw + 120, size * 1.2 + 40); g.restore();
    g.save();
    g.translate(x + tw / 2 + shake, y); g.scale(scale, scale); g.translate(-tw / 2, 0);
    g.textBaseline = 'middle';
    if (slam && age < 0.4) {                                    // chromatic split on the slam
      const sp = Math.exp(-age * 8) * 20;
      g.fillStyle = alpha(C.alarm, a * 0.6); g.fillText(text, -sp, 0);
      g.fillStyle = alpha(C.cool, a * 0.6); g.fillText(text, sp, 0);
    }
    g.fillStyle = alpha(C.type, a);
    g.fillText(text, 0, 0);
    g.fillStyle = alpha(C.cool, a); g.fillRect(0, size * 0.62, 120 * ease(age / 0.3), 4);
    g.restore();
    if ('letterSpacing' in g) g.letterSpacing = '0px';
  }

  function glue(t) {
    // scanlines
    g.fillStyle = 'rgba(0,0,0,0.10)';
    for (let y = 0; y < H; y += 4) g.fillRect(0, y, W, 1);
    // flash on strong onsets: < 3 frames, < 40%
    const so = last(t, B.strong_onsets);
    if (so.age < 0.08) { g.fillStyle = alpha(C.type, 0.35 * (1 - so.age / 0.08)); g.fillRect(0, 0, W, H); }
    // iris wipe on section boundaries
    const s = sectionAt(t), age = t - s.start;
    if (s.start > 0 && age < 0.4) {
      const r = ease(age / 0.4) * Math.hypot(W, H) / 2;
      g.save(); g.strokeStyle = alpha(C.cool, 0.8 * (1 - age / 0.4)); g.lineWidth = 3;
      g.beginPath(); g.arc(W / 2, H / 2, r, 0, Math.PI * 2); g.stroke(); g.restore();
    }
  }

  // Music events: what the song DOES at a bar line, drawn on top of the beat-level glue.
  //   drop        → flash (< 40%), shock ring, edge pulse; strength scales everything
  //   break       → the frame hushes: a dark edge vignette for one bar while the bass is out
  //   beat_change → a scan line sweeps the frame (down for half-time, up for double-time)
  //   build       → edge ticks tighten toward the drop it leads into
  //   hit_run     → (selected runs only) the frame strobes WITH the rapid cuts: see hitRun()
  function music(t) {
    hitRun(t);
    const bar = 60 / B.bpm * 4;
    const dr = lastEvent(t, 'drop');
    if (dr.age < 0.6) {
      const s = dr.e.strength, k = dr.age / 0.6;
      g.fillStyle = alpha(C.type, 0.35 * s * clamp(1 - dr.age / 0.12)); g.fillRect(0, 0, W, H);
      g.strokeStyle = alpha(C.cool, 0.8 * s * (1 - k)); g.lineWidth = 1 + 6 * (1 - k);
      g.beginPath(); g.arc(W / 2, H / 2, 60 + ease(k) * Math.hypot(W, H) / 2, 0, Math.PI * 2); g.stroke();
      if (dr.age < 0.4) {
        const v = g.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.35, W / 2, H / 2, Math.max(W, H) * 0.7);
        v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, alpha(C.cool, 0.35 * s * (1 - dr.age / 0.4)));
        g.fillStyle = v; g.fillRect(0, 0, W, H);
      }
    }
    const br = lastEvent(t, 'break', 0.5);
    if (br.age < bar && dr.e?.t !== br.e?.t) {
      const h = Math.sin(Math.PI * clamp(br.age / bar)) * 0.45 * br.e.strength;
      const v = g.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.3, W / 2, H / 2, Math.max(W, H) * 0.65);
      v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, `rgba(0,0,0,${h})`);
      g.fillStyle = v; g.fillRect(0, 0, W, H);
    }
    const gc = lastEvent(t, 'beat_change', 0.3);
    if (gc.age < 0.5) {
      const k = ease(gc.age / 0.5), y = gc.e.dir === 'down' ? k * H : (1 - k) * H;
      g.fillStyle = alpha(C.cool, 0.5 * (1 - k)); g.fillRect(0, y - 1, W, 2);
      g.fillStyle = alpha(C.cool, 0.08 * (1 - k)); g.fillRect(0, gc.e.dir === 'down' ? 0 : y, W, gc.e.dir === 'down' ? y : H - y);
    }
    const bu = EV.find(e => e.kind === 'build' && t >= e.t && t < e.into);
    if (bu) {
      const k = (t - bu.t) / (bu.into - bu.t), n = 6 + Math.floor(k * 18);
      g.strokeStyle = alpha(C.cool, 0.25 + 0.5 * k); g.lineWidth = 2;
      for (let i = 0; i < n; i++) {
        const x = (i + 0.5) / n * W;
        g.beginPath(); g.moveTo(x, 0); g.lineTo(x, 10 + 20 * k); g.moveTo(x, H); g.lineTo(x, H - 10 - 20 * k); g.stroke();
      }
    }
  }

  // Rapid hard hits (selected hit_run events). Every hit: a 2-frame flash alternating white / accent, a strobing
  // frame border, slice-glitch of the overlay, and a hit counter filling up. Reads as the machine "stuttering" in
  // time with the drums. Only the few selected runs get this - on every fill it would stop being special.
  function hitRun(t) {
    const r = EV.find(e => e.kind === 'hit_run' && e.selected && t >= e.hits[0] - 0.01 && t < e.end + e.spacing + 0.2);
    if (!r) return;
    const h = last(t, r.hits); if (h.i < 0) return;
    const n = r.hits.length, odd = h.i % 2 === 1, live = t < r.end + r.spacing;
    const col = odd ? C.cool : C.type;
    const fl = clamp(1 - h.age / 0.07);
    if (fl > 0 && live) { g.fillStyle = alpha(col, 0.45 * fl); g.fillRect(0, 0, W, H); }
    // strobing border, thicker on every second hit
    const bw = (odd ? 14 : 6) * (live ? 1 : clamp(1 - (t - r.end - r.spacing) / 0.2));
    g.strokeStyle = alpha(col, 0.9 * clamp(1 - h.age / 0.2) + 0.2); g.lineWidth = bw;
    g.strokeRect(bw / 2 + 24, bw / 2 + 24, W - bw - 48, H - bw - 48);
    // hit counter + chips
    const cy = H * 0.78, x0 = W / 2 - n * 11;                // centred, clear of the corner HUD readouts
    g.font = `700 26px ${FONT_M}`; g.textBaseline = 'top'; g.textAlign = 'center'; g.fillStyle = alpha(C.type, 0.9);
    g.fillText(`HIT ${String(h.i + 1).padStart(2, '0')}/${String(n).padStart(2, '0')}`, W / 2, cy);
    g.textAlign = 'left';
    for (let i = 0; i < n; i++) {
      g.fillStyle = alpha(i <= h.i ? col : C.dim, i <= h.i ? 0.95 : 0.6);
      g.fillRect(x0 + i * 22, cy + 36, 16, 16);
    }
    // slice glitch of what is already drawn, for 2 frames per hit
    if (h.age < 0.07 && live) {
      g.save(); g.setTransform(1, 0, 0, 1, 0, 0);
      for (let s = 0; s < 5; s++) {
        const y = Math.floor(rand(h.i * 17 + s) * cv.height), hh = Math.floor((8 + rand(h.i * 5 + s) * 60) * DPR);
        g.drawImage(cv, 0, y, cv.width, hh, Math.floor((rand(h.i * 3 + s) - 0.5) * 140 * DPR), y, cv.width, hh);
      }
      g.restore();
    }
  }

  function introOutro(t) {
    // intro: one line draws itself across black-ish frame
    if (t < 4) {
      const k = ease(t / 2.5);
      g.strokeStyle = alpha(C.cool, 1); g.lineWidth = 2;
      g.beginPath(); g.moveTo(W * 0.1, H / 2); g.lineTo(W * (0.1 + 0.8 * k), H / 2); g.stroke();
    }
    // outro fade handled by density; final word could be drawn here
  }


  // ---------- SCENES: lyric-driven graphics (take over from the HUD, then hand back) ----------
  // Each scene is (t, k, s) → draws, k = fade envelope 0..1, s = {start, end, age, u} with u = progress 0..1.
  // Keep each one a pure function of t like every layer. Default stage: the right half (lyric sits left).
  // Ideas that worked (Agents in the Loop): people icons flipping into agents ("replacing…"), 1,000 dots dropping
  // out with a counter ("workers fired"), a career bar burning to ash, a cost curve plunging to $0.00, a balance
  // tipping to PROFIT, market vs society lines diverging, blast doors sliding shut, an ECG flatlining,
  // a breaking economic loop diagram, lights in a grid going out, a segmented progress bar to 100%.
  const RX = 1340, RY = 500;
  const label = (txt, x, y, col, a, size = 18, align = 'left', font = FONT_M, weight = 600) => {
    g.font = `${weight} ${size}px ${font}`; g.textAlign = align; g.textBaseline = 'alphabetic';
    g.fillStyle = alpha(col, a); g.fillText(txt, x, y); g.textAlign = 'left';
  };
  const SCENES = {
    // example: a big ring with agents racing around it (e.g. on the hook line)
    loop(t, k, s) {
      const r = 330;
      g.strokeStyle = alpha(C.cool, 0.5 * k); g.lineWidth = 2; g.beginPath(); g.arc(RX, RY, r, 0, Math.PI * 2); g.stroke();
      for (let i = 0; i < 24; i++) {
        const a0 = hash(i, 1) * 6.283 + t * (1.2 + hash(i, 2) * 1.6);
        for (let tr = 0; tr < 8; tr++) {
          const a = a0 - tr * 0.05;
          g.fillStyle = alpha(i % 6 === 0 ? C.warn : C.cool, k * (1 - tr / 8));
          g.beginPath(); g.arc(RX + Math.cos(a) * r, RY + Math.sin(a) * r, 7 - tr * 0.6, 0, Math.PI * 2); g.fill();

    return {
      t, loud: L, doom: story, red,
      swarm: { density: on * (0.15 + 0.7 * story) * (1 - 0.5 * sk + 0.5 * (lockK + engulf)), lock: lockK, engulf, opacity: 0.75 },
      ribbon: { on: on * 0.8 * (1 - 0.5 * sk) },
      floor: { on: on * 0.45 * (1 - 0.4 * sk) * (plateAt(t)?.s.vp?.conf >= 0.3 ? 0 : 1), ripple: { age: M.dAge, s: M.dS }, collapse: 0, tilt: 0 },
      cam: { shake: M.dS * Math.exp(-M.dAge * 8) + (M.hit && M.hitLive ? 0.5 * Math.exp(-M.hit.age * 12) : 0),
             push: M.bu ? 2.5 * ease((t - M.bu.t) / (M.bu.into - M.bu.t)) : 0 },
      scene: has3 ? { name: sc.s.scene, k: sc.k, u: sc.u, age: sc.age } : null,
      panels: { stage: panelPose(t, 'stage', M), hud: panelPose(t, 'hud', M) },
    };
  }
  function world3d(t) {
    if (!WORLD) return;
    const { flat } = WORLD.seek(direct3d(t));
    g.drawImage(GLCV, 0, 0, W, H);
    for (const n of Object.keys(PCV)) if (flat[n]) g.drawImage(PCV[n], 0, 0, W, H);   // flat panels: plain 2D
  }

  const LAYERS = {
    world3d,                                                  // 3D first (incl. the panels): the 2D layers sit on top
    plateFX,                                                  // graphics that follow the picture
    ribbon,
    gimbal,
    tickRail,
    hud,
    scene: (t) => scene(t),
    lyric: (t) => lyric(t),
    music: (t) => music(t),
    introOutro: (t) => introOutro(t),
    glue: (t) => glue(t),
  };
  const urlLayers = qs.get('layers') ? qs.get('layers').split(',') : null;

  // ---------- seek(t): the only entry point ----------
  // base HUD layers that step back while a lyric scene is active (the ribbon stays faintly)
  const HUD_LAYERS = new Set(['ribbon', 'gimbal', 'tickRail', 'hud']);
  window.seek = (t) => {
    const main = g;
    g.setTransform(DPR, 0, 0, DPR, 0, 0);
    g.clearRect(0, 0, W, H);
    for (const n of Object.keys(PG)) { PG[n].setTransform(DPR, 0, 0, DPR, 0, 0); PG[n].clearRect(0, 0, W, H); }
    // global build/teardown: parts assemble over the first bars and come apart in the last 4 s
    const build = ease((t - 1.5) / 4), teardown = 1 - ease((t - (B.duration - 4)) / 3);
    const o = cutAt(t)?.overlay || {};
    const d = (o.density ?? density(t)) * build * teardown;
    const run = (name, fn) => {
      if (urlLayers && !urlLayers.includes(name)) return;
      if (o.only && !o.only.includes(name)) return;
      if (o.hide && o.hide.includes(name)) return;
      const sk = HUD_LAYERS.has(name) ? (sceneAt(t)?.k || 0) : 0;
      const dd = d * (1 - sk * (name === 'ribbon' ? 0.6 : 1));
      if (HUD_LAYERS.has(name) && dd <= 0.001) return;
      g.save(); fn(t, dd); g.restore();
    };
    // pass 1: panel layers draw into their offscreen canvases; pass 2: the rest on the main canvas, world3d first
    if (WORLD) for (const [name, fn] of Object.entries(LAYERS)) if (PANEL_OF[name]) { g = PG[PANEL_OF[name]]; run(name, fn); g = main; }
    for (const [name, fn] of Object.entries(LAYERS)) if (!WORLD || !PANEL_OF[name]) run(name, fn);
    return true;
  };

  // ---------- data loading ----------
  async function load() {
    if (window.__DATA__) {
      const D = window.__DATA__;
      if (D.beats) B = D.beats; if (D.lyrics) LYR = D.lyrics; if (D.storyboard) SB = D.storyboard; if (D.features) FEAT = D.features;
      if (D.scenes) window.__SCN = D.scenes;
    } else {
      const get = async (u) => { try { const r = await fetch(u); return r.ok ? r.json() : null; } catch { return null; } };
      B = (await get(qs.get('beats') || '../audio-analysis/beats.json')) || B;
      LYR = (await get(qs.get('lyrics') || 'lyrics.json')) || LYR;
      SB = await get(qs.get('storyboard') || '../../video/storyboard.json');
      window.__SCN = await get(qs.get('scenes') || 'scenes.json');
    }
    LYR = LYR.map(l => ({ ...l, t: l.t ?? l.start })).sort((a, b) => a.t - b.t);
    EV = (SB?.markers?.drops || []).slice().sort((a, b) => a.t - b.t);
    await initWorld();
    resolveScenes(window.__SCN);
    await document.fonts.ready;
  }
  window.ready = load().then(() => { window.seek(0); return true; });

  // live preview only (never used by the renderer): plays the timeline with the wall clock
  if (qs.get('preview')) window.ready.then(() => {
    const t0 = performance.now() / 1000 - (+qs.get('t') || 0);
    const loop = () => { window.seek((performance.now() / 1000 - t0) % B.duration); requestAnimationFrame(loop); };
    loop();
  });
})();
</script>
</body>
</html>
